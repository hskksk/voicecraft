[project]
name = "voicecraft"
version = "0.1.0"
description = "AI-powered speech synthesis tool with multi-speaker support for OpenAI and Gemini models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.106.1",
    "google-genai>=0.8.0",
    "litellm>=1.50.0",
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "a2a-python>=0.0.1",
    "mcp>=1.14.0",
    "fastmcp>=2.12.3",
]

[project.scripts]
voicecraft = "voicecraft.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mcp[cli]>=1.14.0",
]
